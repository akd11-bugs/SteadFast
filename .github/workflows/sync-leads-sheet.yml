name: Sync leads from Google Sheet

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler can slip by several minutes under
    # load and pauses after 60 days of repo inactivity — fine for a lead
    # sheet, not suitable if sub-minute freshness is ever needed.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# A slow run must not overlap the next tick (or a manual run): both would read
# the same cursor and import every new row twice. The route also locks per org.
concurrency:
  group: sync-leads-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call the sync endpoint
        run: |
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SYNC_API_KEY }}" \
            "${{ secrets.APP_URL }}/api/cron/sync-leads-sheet")
          echo "HTTP status: $status"
          # Counts only: skip reasons carry lead emails/names, and Actions logs
          # are readable by anyone with repo access. Details live in the job run.
          jq -c '[.results[]? | {source, created, skipped: (.skipped | length), warnings: (.customFieldWarnings | length), failed: (.error != null)}]' /tmp/response.json \
            || echo "(response was not the expected JSON)"
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
